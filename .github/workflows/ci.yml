name: CI / PR Checks
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # testbump needs tags to compare against
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx eslint
      - run: npm run test -- --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=lcov.info
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: gh api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CONTEXT=$([[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && echo "PR" || echo "branch")
          if BUMP=$(npx --yes testbump@latest 2>/dev/null) && [[ "$BUMP" =~ ^(major|minor|patch)$ ]]; then

            CONCLUSION="success"

            case "$BUMP" in
              major) LABEL="MAJOR"; DOT="🔴" ;;
              minor) LABEL="MINOR"; DOT="🟠" ;;
              patch) LABEL="PATCH"; DOT="🟢" ;;
            esac

            TITLE="$DOT $LABEL"
            CURRENT_VERSION=$(jq -r .version package.json)

            NEXT_VERSION=$(npm version "$BUMP" --no-git-tag-version | cut -c 2-)
            git restore package.json package-lock.json

            SUMMARY="Based on your test contracts, merging this $CONTEXT will trigger a **$BUMP** release (**$CURRENT_VERSION** → **$NEXT_VERSION**)."

            # If this is a PR, automatically add the version label (major/minor/patch)
            if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              gh pr edit ${{ github.event.pull_request.number }} --add-label "$BUMP"
            fi
          else
            CONCLUSION="failure"
            TITLE="❌ Error"
            SUMMARY="Failed to evaluate this $CONTEXT. Ensure your repository has a baseline git tag and that your tests are passing."
          fi

          gh api --method POST "/repos/$GITHUB_REPOSITORY/check-runs" -f name="testbump" -f head_sha="$SHA" -f status="completed" -f conclusion="$CONCLUSION" -f output[title]="$TITLE" -f output[summary]="$SUMMARY"
